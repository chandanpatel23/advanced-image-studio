services:
  advanced-image-studio:
    build: .
    container_name: advanced-image-studio
    environment:
      NODE_ENV: production
      PORT: 3000
    ports:
      - "${PORT:-3000}:3000"
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/api/health').then(response => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s